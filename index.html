<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Employee Task Manager</h1>
</header>
<section class="summary">
    <div class="summary-card">
        <span>Total Tasks</span>
        <strong id="totalTasks">0</strong>
    </div>

    <div class="summary-card">
        <span>Completed</span>
        <strong id="completedTasks">0</strong>
    </div>

    <div class="summary-card">
        <span>Pending</span>
        <strong id="pendingTasks">0</strong>
    </div>
</section>
<section class="task-form">
    <h2>Add Task</h2>
    <form id="taskForm">
        <div class="form-field">
            <label for="employeeName">Employee Name</label>
            <input type="text" id="employeeName" required>
        </div>
        <div class="form-field">
            <label for="department">Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
            </select>
        </div>

        <div class="form-field">
            <label for="task">Task</label>
            <input type="text" id="task" required>
        </div>

        <div class="form-field">
            <label for="priority">Priority</label>
            <select id="priority" required>
                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>
        <div class="form-field">
            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" required>
        </div>
        <button type="submit">Add Task</button>
    </form>
</section>
<section class="search-filter">
    <h2>Search & Filter</h2>
    <input id="searchTask" type="text" placeholder="Search tasks...">
    <select id="filterDepartment">
        <option value="">All Departments</option><option>HR</option><option>IT</option>
        <option>Finance</option><option>Marketing</option>
    </select>
    <select id="filterStatus">
        <option value="">All Status</option><option>Pending</option><option>Completed</option>
    </select>
</section>
<section class="task-list">
    <h2>Task List</h2>
    <table>
        <thead><tr><th>Employee</th><th>Department</th><th>Task</th><th>Priority</th><th>Due Date</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="taskList"></tbody>
    </table>
</section>
<script src="script.js"></script>
</body>
</html>
